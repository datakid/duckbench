name: Resolve Cargo.lock

on:
  push:
    branches: [native-duckdb]
    paths:
      - '.github/workflows/cargo-lock.yml'

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the dependencies without compiling
        working-directory: desktop/src-tauri
        run: |
          cargo metadata --format-version 1 > /dev/null
          wc -l Cargo.lock
          sha256sum Cargo.lock

      - name: Send the lock file back as annotations
        working-directory: desktop/src-tauri
        run: |
          SUM="$(sha256sum Cargo.lock | cut -c1-16)"
          xz -9e -c Cargo.lock | base64 -w0 > "$RUNNER_TEMP/lock.b64"
          split -b 3900 -d -a 3 "$RUNNER_TEMP/lock.b64" "$RUNNER_TEMP/lock.part."
          i=0
          for f in "$RUNNER_TEMP"/lock.part.*; do
            if [ "$i" -lt 10 ]; then level=notice; elif [ "$i" -lt 20 ]; then level=warning; else level=error; fi
            node "${{ github.workspace }}/.github/scripts/annotate.mjs" "$level" "lock $SUM part $i" "$f" 4000
            i=$((i + 1))
          done
          echo "parts: $i"
