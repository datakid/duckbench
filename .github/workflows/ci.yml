name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run self-tests in headless Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          python .github/scripts/web_selftest.py http://127.0.0.1:8765/tests.html

  desktop:
    name: Desktop installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare bundle and run Rust tests
        run: npm run check

      - name: Check offline Excel extension was bundled
        shell: bash
        run: |
          for p in wasm_mvp wasm_eh; do
            test -s "dist/vendor/duckdb/extensions/v1.4.3/$p/excel.duckdb_extension.wasm"
          done

      - name: Build installer
        run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: List bundle output
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis

      - uses: actions/upload-artifact@v7
        with:
          name: duckbench-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
