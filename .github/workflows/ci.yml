name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run self-tests in headless Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          python .github/scripts/web_selftest.py http://127.0.0.1:8765/tests.html

      - name: Run DuckDB parity suite in headless Chromium
        run: |
          python -m http.server 8766 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          python .github/scripts/web_parity.py http://127.0.0.1:8766/parity.html

  desktop:
    name: Desktop installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare bundle and run Rust tests
        run: npm run check

      - name: Check offline DuckDB extensions were bundled
        shell: bash
        run: |
          for p in wasm_eh; do
            for e in excel parquet json; do
              test -s "dist/vendor/duckdb/extensions/v2.0.0/$p/$e.duckdb_extension.wasm"
            done
          done

      - name: Build installer
        run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: List bundle output
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis

      - uses: actions/upload-artifact@v7
        with:
          name: duckbench-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux packages (build)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git sudo build-essential pkg-config file xz-utils zstd libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare bundle and run Rust tests
        working-directory: desktop
        run: npm run check

      - name: Check offline DuckDB extensions were bundled
        working-directory: desktop
        run: |
          for p in wasm_eh; do
            for e in excel parquet json; do
              test -s "dist/vendor/duckdb/extensions/v2.0.0/$p/$e.duckdb_extension.wasm"
            done
          done

      - name: Build packages
        working-directory: desktop
        run: npx tauri build --bundles deb,appimage --config src-tauri/tauri.ci.conf.json

      - name: Collect packages
        run: |
          mkdir linux-dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb linux-dist/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage linux-dist/
          ls -la linux-dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: linux-dist
          if-no-files-found: error

  linux-test:
    name: Linux compatibility
    needs: linux
    uses: ./.github/workflows/linux-compat.yml
