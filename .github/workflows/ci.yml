name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run self-tests in headless Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          python .github/scripts/web_selftest.py http://127.0.0.1:8765/tests.html

      - name: Run DuckDB parity suite in headless Chromium
        run: |
          python -m http.server 8766 --bind 127.0.0.1 > /dev/null 2>&1 &
          sleep 2
          python .github/scripts/web_parity.py http://127.0.0.1:8766/parity.html

  desktop:
    name: Desktop installer (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare bundle and run Rust tests
        run: npm run check

      - name: Check offline DuckDB extensions were bundled
        shell: bash
        run: |
          for p in wasm_eh; do
            for e in excel parquet json; do
              test -s "dist/vendor/duckdb/extensions/v2.0.0/$p/$e.duckdb_extension.wasm"
            done
          done

      - name: Build installer
        run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: List bundle output
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis

      - uses: actions/upload-artifact@v7
        with:
          name: duckbench-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Desktop packages (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf xvfb webkit2gtk-driver

      - name: Install JS dependencies
        run: npm ci

      - name: Prepare bundle and run Rust tests
        run: npm run check

      - name: Check offline DuckDB extensions were bundled
        run: |
          for p in wasm_eh; do
            for e in excel parquet json; do
              test -s "dist/vendor/duckdb/extensions/v2.0.0/$p/$e.duckdb_extension.wasm"
            done
          done

      - name: Build packages
        run: npx tauri build --bundles deb,appimage --config src-tauri/tauri.ci.conf.json

      - name: Install the deb package
        run: sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb

      - name: Restore tauri-driver
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v1

      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Smoke-test the installed app with the network blocked
        run: |
          python3 -m pip install selenium duckdb
          mkdir -p /tmp/probe
          python3 - <<'PY'
          import duckdb
          c = duckdb.connect()
          c.execute("COPY (SELECT range AS id, 'name_' || range AS name, random() AS v FROM range(250000)) TO '/tmp/probe/big.csv' (HEADER)")
          c.execute("COPY (SELECT range AS id, 'name_' || range AS name, random() AS v FROM range(250000)) TO '/tmp/probe/data.parquet' (FORMAT PARQUET)")
          PY
          echo "127.0.0.1 extensions.duckdb.org cdn.jsdelivr.net" | sudo tee -a /etc/hosts
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 GDK_BACKEND=x11
          xvfb-run -a --server-args="-screen 0 1280x800x24" python3 "$GITHUB_WORKSPACE/.github/scripts/desktop_smoke_linux.py" "$(which duckbench)"
