name: Pre-alpha release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created on the selected branch if it does not exist)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a valid version (expected e.g. v2.3.0-alpha.1)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into app config
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare bundle and run Rust tests
        working-directory: desktop
        run: npm run check

      - name: Check offline DuckDB extensions were bundled
        working-directory: desktop
        shell: bash
        run: |
          for p in wasm_eh; do
            for e in excel parquet json; do
              test -s "dist/vendor/duckdb/extensions/v2.0.0/$p/$e.duckdb_extension.wasm"
            done
          done

      - name: Build installer
        working-directory: desktop
        run: npx tauri build --bundles nsis --config src-tauri/tauri.ci.conf.json

      - name: Collect installer and checksum
        id: pack
        shell: bash
        run: |
          mkdir -p dist
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe dist/
          cd dist
          for f in *.exe; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la
          echo "installer=$(ls *.exe | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        shell: bash
        env:
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
          INSTALLER: ${{ steps.pack.outputs.installer }}
        run: |
          {
            if [ "$PRERELEASE" = "true" ]; then
              echo "**Pre-alpha — for testing only.** The desktop app is in preview: expect bugs and breaking changes."
              echo
            fi
            echo "Windows installer: \`$INSTALLER\`."
            echo
            echo "This build is **not code-signed**, so Windows SmartScreen will show a warning. Choose *More info* then *Run anyway*. The SHA-256 checksum is attached for verification. It has no auto-update yet."
            echo
            echo "Duckbench runs entirely on your PC. Files are never uploaded."
          } > notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "Duckbench $VERSION" \
              --notes-file notes.md \
              $FLAGS
          fi

  linux:
    name: Build Linux packages
    needs: release
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf

      - name: Resolve version from tag
        id: ver
        run: |
          VERSION="${TAG#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag '$TAG' is not a valid version (expected e.g. v2.3.0-alpha.1)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp version into app config
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = process.env.VERSION;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + '\n');
          "

      - name: Install JS dependencies
        working-directory: desktop
        run: npm ci

      - name: Prepare bundle and run Rust tests
        working-directory: desktop
        run: npm run check

      - name: Check offline DuckDB extensions were bundled
        working-directory: desktop
        run: |
          for p in wasm_eh; do
            for e in excel parquet json; do
              test -s "dist/vendor/duckdb/extensions/v2.0.0/$p/$e.duckdb_extension.wasm"
            done
          done

      - name: Build packages
        working-directory: desktop
        run: npx tauri build --bundles deb,appimage --config src-tauri/tauri.ci.conf.json

      - name: Collect packages and checksums
        run: |
          mkdir -p linux-dist
          cp desktop/src-tauri/target/release/bundle/deb/*.deb linux-dist/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage linux-dist/
          cd linux-dist
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la

      - name: Attach packages to the release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release upload "$TAG" linux-dist/* --clobber
          BODY="$(gh release view "$TAG" --json body --jq .body)"
          if ! printf '%s' "$BODY" | grep -q '^## Linux'; then
            cat > linux-notes.md <<'NOTES'
          ## Linux (x86_64 only, pre-alpha)

          Two packages are attached, each with a `.sha256` file:

          | | `Duckbench___VERSION___amd64.deb` | `Duckbench___VERSION___amd64.AppImage` |
          |---|---|---|
          | For | Debian, Ubuntu and derivatives such as Linux Mint and Pop!_OS | Any other x86_64 distribution (Fedora, openSUSE, Arch and so on) |
          | Needs | `libwebkit2gtk-4.1-0` and `libgtk-3-0` from your distribution, and glibc 2.34 or newer | glibc 2.35 or newer. It bundles WebKitGTK 4.1 and GTK, so it is large (about 90 MB, 259 MB unpacked) |
          | Run it | `sudo apt install ./Duckbench___VERSION___amd64.deb` | `chmod +x` the file and run it. It needs FUSE to mount; without FUSE run it with `--appimage-extract-and-run` |

          **What CI tests on every release.** Ubuntu 22.04 on x86_64 (GitHub's runner), with WebKitGTK 2.50 on a virtual X11 display (Xvfb, software rendering). CI installs the `.deb`, starts the app and checks, with the network blocked: the DuckDB 2.0 engine starts, Parquet export, JSON export and the Excel extension work offline, and DuckDB reads a 250,000-row CSV and a 250,000-row Parquet file straight from disk. The AppImage was tested the same way, using `--appimage-extract-and-run` (FUSE mounting was not tested).

          **Distributions**
          - **Tested by CI on every release:** Ubuntu 22.04.
          - **Also tested by hand for v2.4.0-alpha.4 only:** Ubuntu 24.04 and Ubuntu 26.04, both the `.deb` and the AppImage, with the same checks (the *Linux compatibility* workflow). Later releases get that check only when someone runs it.
          - **Expected to work, never run:** Debian 12 (use the `.deb`); Fedora 36 or newer, openSUSE and Arch (use the AppImage). They meet the requirements above, but nobody has started the app on them.
          - **Not supported:** Ubuntu 20.04, Debian 11 and older (no WebKitGTK 4.1, older glibc). RHEL, Rocky and AlmaLinux 9 and older (glibc below 2.35 for the AppImage, and there is no `.rpm`). 32-bit systems. ARM and aarch64 machines such as a Raspberry Pi (not built). There is no `.rpm`, Flatpak or Snap.

          **Limits you should know about**
          - DuckDB runs in memory on Linux, because the WebKitGTK web view has no OPFS. Files are still read in place from disk, but very large sorts and group-bys are limited by free memory.
          - Not tested at all: real hardware or GPU rendering, Wayland, the native Open and Save dialogs, drag and drop, and the speed on large files (the test used 250,000 rows). Expect rough edges.
          - The Linux builds are unsigned and have no auto-update.
          NOTES
            sed -i "s/__VERSION__/$VERSION/g" linux-notes.md
            { printf '%s\n\n' "$BODY"; cat linux-notes.md; } > notes-all.md
            gh release edit "$TAG" --notes-file notes-all.md
          fi
