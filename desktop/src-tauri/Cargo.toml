[package]
name = "duckbench"
version = "2.2.0"
description = "Duckbench desktop: local data-prep workbench powered by DuckDB"
authors = ["Duckbench"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "duckbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
